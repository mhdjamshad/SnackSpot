<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SnackSpot Orders</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%0A%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%238e2a4f%22/%3E%0A%3Ctext%20x%3D%2250%22%20y%3D%2266%22%20font-size%3D%2256%22%20text-anchor%3D%22middle%22%3E%F0%9F%8D%AA%3C/text%3E%0A%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%0A%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%238e2a4f%22/%3E%0A%3Ctext%20x%3D%2250%22%20y%3D%2266%22%20font-size%3D%2256%22%20text-anchor%3D%22middle%22%3E%F0%9F%8D%AA%3C/text%3E%0A%3C/svg%3E">
<meta name="theme-color" content="#8e2a4f">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22SnackSpot%20Orders%22%2C%22short_name%22%3A%22SnackSpot%22%2C%22display%22%3A%22standalone%22%2C%22start_url%22%3A%22.%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage/svg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A//www.w3.org/2000/svg%2522%2520viewBox%253D%25220%25200%2520100%2520100%2522%253E%250A%253Crect%2520width%253D%2522100%2522%2520height%253D%2522100%2522%2520rx%253D%252222%2522%2520fill%253D%2522%25238e2a4f%2522/%253E%250A%253Ctext%2520x%253D%252250%2522%2520y%253D%252266%2522%2520font-size%253D%252256%2522%2520text-anchor%253D%2522middle%2522%253E%25F0%259F%258D%25AA%253C/text%253E%250A%253C/svg%253E%22%2C%22sizes%22%3A%22100x100%22%2C%22type%22%3A%22image/svg%2Bxml%22%7D%5D%7D">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1c2233;--mu:#69708a;--ac:#8e2a4f;--ac-t:#fff;--hi:#f3c65a;--bd:#dfe2ea;--dg:#b3261e;
font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;box-sizing:border-box;padding-top:max(env(safe-area-inset-top,0px),28px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141826;--card:#1e2436;--tx:#eef0f7;--mu:#98a0ba;--ac:#e0779b;--ac-t:#1a0a12;--hi:#f3c65a;--bd:#2f3650;--dg:#f2b8b5}}
:root[data-theme="dark"]{--bg:#141826;--card:#1e2436;--tx:#eef0f7;--mu:#98a0ba;--ac:#e0779b;--ac-t:#1a0a12;--hi:#f3c65a;--bd:#2f3650;--dg:#f2b8b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-size:16px}
main{max-width:560px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:28px;font-weight:800;margin:6px 0 12px;letter-spacing:-.02em}
h2{font-size:18px;font-weight:600;margin:22px 0 8px}
.mu{color:var(--mu);font-size:14px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
input,select{display:block;width:100%;font:inherit;font-size:17px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:4px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.big{font-weight:600;margin:0 0 10px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:0 8px}
.btn{width:100%;font:inherit;font-weight:600;font-size:17px;background:var(--ac);color:var(--ac-t);border:0;border-radius:10px;padding:13px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ac);border:1.5px solid var(--ac);padding:9px;font-size:15px;margin-top:8px}
.link{font:inherit;font-size:14px;background:none;border:0;padding:6px 0;cursor:pointer;color:var(--mu)}
.link.dg{color:var(--dg)}
.ph{display:flex;justify-content:space-between;align-items:center}
.ck{width:40px;height:40px;border-radius:50%;border:2px solid var(--bd);background:transparent;color:var(--bd);font-size:22px;font-weight:800;line-height:1;cursor:pointer}
.ck.on{background:#1f9d4d;border-color:#1f9d4d;color:#fff}
.card.paid{border-color:#1f9d4d}
.sub{font-weight:600;font-size:14px;margin:6px 0}
.chips{display:flex;gap:8px;margin-bottom:10px}
.chips.w{flex-wrap:wrap}.chips.w .chip{flex:1 1 21%}
.chips.g{display:grid;grid-template-columns:1fr 1fr}
.chip{flex:1;font:inherit;font-weight:600;padding:11px 0;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.chip.on{background:var(--ac);color:var(--ac-t);border-color:var(--ac)}
.qty{display:flex;gap:8px;margin-bottom:12px}
.qty button{width:52px;font-size:24px;border-radius:10px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.qty input{text-align:center;margin:0;font-weight:600}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bd)}
.ln:first-of-type{border-top:0}
.x{background:none;border:0;color:var(--dg);font-size:18px;padding:4px 8px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:800;padding-top:8px;margin-top:4px;border-top:2px solid var(--tx)}
.gt{background:var(--hi);color:#1c2233;border-radius:12px;padding:14px;display:flex;justify-content:space-between;font-weight:800;font-size:20px}
.pn{font-weight:800;font-size:18px;margin-bottom:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:max(env(safe-area-inset-bottom,0px),10px)}
.tab{flex:1;font:inherit;font-weight:600;background:none;border:0;padding:15px 0;color:var(--mu);cursor:pointer;border-top:3px solid transparent}
.tab.on{color:var(--ac);border-top-color:var(--ac)}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs">
<button class="tab" data-t="orders" onclick="setTab('orders')">Orders</button>
<button class="tab" data-t="summary" onclick="setTab('summary')">Summary &amp; bills</button>
<button class="tab" data-t="catalog" onclick="setTab('catalog')">Catalog</button>
</nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const SIZES=[100,250,500,1000],BOT=[10,30,60,250,500,1000],ORD=[100,250,500,1000,10010,10030,10060,10250,10500,11000,0,-1];
const lbl=s=>s===0?'PCS':s<0?'PKT':s>=10000?(s>=11000?'1 L':(s-10000)+' ML'):s>=1000?'1 KG':s+' GM';
const sz=s=>s>0?lbl(s)+' ':'';
const sfx=s=>s>0?', '+lbl(s):'';
const S={products:[],lines:[],delivery:'',shop:'SnackSpot',paid:{},flat:'',pid:'',size:500,qty:1,msg:'',arm:null};
try{const d=JSON.parse(localStorage.getItem('preorder-v1'));if(d){S.products=d.products||[];S.lines=d.lines||[];S.delivery=d.delivery||'';S.shop=d.shop||'SnackSpot';S.paid=d.paid||{}}}catch(e){}
const save=()=>{try{localStorage.setItem('preorder-v1',JSON.stringify({products:S.products,lines:S.lines,delivery:S.delivery,shop:S.shop,paid:S.paid}))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-IN');
const rs=n=>'₹'+fmt(n);
const prod=id=>S.products.find(p=>p.id===id);
const isPc=id=>{const p=prod(id);return !!p&&(p.unit==='pc'||p.unit==='pk')};
const sizesFor=id=>{const p=prod(id);if(!p||isPc(id))return[];return p.unit==='bt'?BOT.filter(m=>p['b'+m]>0).map(m=>10000+m):SIZES};
const wprice=(p,s)=>{if(s<=0)return p.wkg||0;if(s>=10000)return p['wb'+(s-10000)]||0;return (p.wkg||0)*s/1000};
const price=(p,s)=>{if(s<=0)return p.kg||0;if(s>=10000)return p['b'+(s-10000)]||0;const o=p['p'+s];return o>0?o:(p.kg||0)*s/1000};
let tab=S.products.length?'orders':'catalog',G=[];

function setTab(t){tab=t;S.arm=null;S.msg='';render()}
function render(){
  $('app').innerHTML=tab==='catalog'?vCat():tab==='orders'?vOrd():vSum();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}
function $(id){return document.getElementById(id)}
function arm(k,fn){if(S.arm===k){S.arm=null;fn()}else{S.arm=k;setTimeout(()=>{if(S.arm===k){S.arm=null;render()}},3000)}render()}

/* Catalog */
function vCat(){
  return `<h1>Catalog</h1><p class="mu">Choose weight, piece, packet or bottle for each product. Enter the retail price (what customers pay) and the wholesale price (your cost). For weight items, prices per KG are enough: 500, 250 and 100 GM are worked out automatically.</p>`+
  S.products.map(p=>`<div class="card"><input class="big" placeholder="Product name" value="${esc(p.name)}" onchange="upd('${p.id}','name',this.value)">
  <div class="chips g">${[['kg','By weight'],['pc','Per piece'],['pk','Per packet'],['bt','Per bottle']].map(([u,t])=>`<button class="chip ${(p.unit||'kg')===u?'on':''}" onclick="unit('${p.id}','${u}')">${t}</button>`).join('')}</div>
  ${priceForm(p)}
  <button class="link dg" onclick="delP('${p.id}')">${S.arm===p.id?'Tap again to delete':'Delete product'}</button></div>`).join('')+
  `<button class="btn" onclick="addP()">Add product</button>`;
}
function fld(p,key,label,auto){return `<label>${label}<input type="number" inputmode="decimal" ${auto?'placeholder="auto" ':''}value="${p[key]||''}" onchange="upd('${p.id}','${key}',+this.value)"></label>`}
const H=t=>`<div class="sub">${t}</div>`;
function priceForm(p){
  const u=p.unit;
  if(u==='bt'){const L=m=>m>=1000?'1 L':m+' ML';
    return H(`Retail price per bottle (leave blank for sizes you don't sell)`)+'<div class="g2">'+BOT.map(m=>fld(p,'b'+m,L(m)+' (₹)')).join('')+'</div>'+H('Wholesale price per bottle')+'<div class="g2">'+BOT.map(m=>fld(p,'wb'+m,L(m)+' (₹)')).join('')+'</div>';}
  if(u==='pc'||u==='pk'){const w=u==='pk'?'packet':'piece';return H('Retail price')+fld(p,'kg','Per '+w+' (₹)')+H('Wholesale price')+fld(p,'wkg','Per '+w+' (₹)')}
  return H('Retail price')+'<div class="g2">'+fld(p,'kg','Per KG (₹)')+[500,250,100].map(z=>fld(p,'p'+z,z+' GM (₹)',1)).join('')+'</div>'+H('Wholesale price')+fld(p,'wkg','Per KG (₹)');
}
function unit(id,u){const p=prod(id);if(p){p.unit=u;save();render()}}
function upd(id,k,v){const p=prod(id);if(p){p[k]=v;save()}}
function addP(){S.products.push({id:uid(),name:'',kg:0});save();render();const i=document.querySelectorAll('.big');i[i.length-1].focus()}
function delP(id){arm(id,()=>{S.products=S.products.filter(p=>p.id!==id);save()})}

/* Orders */
function vOrd(){
  if(!S.products.length)return `<h1>Orders</h1><div class="card">Add your products in the Catalog tab first.</div>`;
  const named=S.products.filter(p=>p.name);
  if(!prod(S.pid)||!prod(S.pid).name)S.pid=named.length?named[0].id:'';
  return `<h1>Enter orders</h1><div class="card">
  <label>Flat number<input value="${esc(S.flat)}" oninput="S.flat=this.value" placeholder="e.g. A-101" autocapitalize="characters" autocomplete="off"></label>
  <label>Product<select onchange="S.pid=this.value;render()">${named.map(p=>`<option value="${p.id}" ${p.id===S.pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
  ${chips()}
  <div class="qty"><button onclick="q(-1)" aria-label="Less">−</button><input type="number" inputmode="numeric" value="${S.qty}" oninput="S.qty=Math.max(1,parseInt(this.value)||1)"><button onclick="q(1)" aria-label="More">+</button></div>
  <button class="btn" onclick="addL()">Add to order</button><p class="mu" style="margin:10px 0 0">${esc(S.msg)}</p></div>`+vLines();
}
function chips(){
  if(isPc(S.pid))return '';
  const z=sizesFor(S.pid);
  if(!z.length)return '<p class="mu">Set bottle prices for this product in the Catalog first.</p>';
  if(!z.includes(S.size))S.size=z[0];
  return `<div class="chips w">${z.map(s=>`<button class="chip ${s===S.size?'on':''}" onclick="S.size=${s};render()">${lbl(s)}</button>`).join('')}</div>`;
}
function q(d){S.qty=Math.max(1,S.qty+d);render()}
function addL(){
  const f=S.flat.trim().toUpperCase();
  if(!f||!S.pid){S.msg='Enter a flat number and choose a product.';render();return}
  if(!isPc(S.pid)&&!sizesFor(S.pid).includes(S.size)){S.msg='Choose a size first.';render();return}
  const z=isPc(S.pid)?(prod(S.pid).unit==='pk'?-1:0):S.size;
  S.lines.push({id:uid(),flat:f,pid:S.pid,size:z,qty:S.qty});
  S.msg='Added: '+prod(S.pid).name+sfx(z)+' × '+S.qty+' for flat '+f;
  S.flat=f;S.qty=1;save();render();
}
function delL(id){S.lines=S.lines.filter(l=>l.id!==id);save();render()}
function groups(){
  const g={};S.lines.forEach(l=>(g[l.flat]=g[l.flat]||[]).push(l));
  return Object.keys(g).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(f=>[f,g[f]]);
}
function vLines(){
  if(!S.lines.length)return '<p class="mu">No orders entered yet.</p>';
  const g=groups();
  return `<h2>Entered so far (${g.length} flats)</h2>`+g.map(([f,ls])=>`<div class="card"><div class="pn">Flat ${esc(f)}</div>`+
    ls.map(l=>{const p=prod(l.pid);return `<div class="ln"><span>${esc(p?p.name:'Removed item')}${sfx(l.size)} × ${l.qty}</span><button class="x" onclick="delL('${l.id}')" aria-label="Remove">✕</button></div>`}).join('')+`</div>`).join('');
}

/* Summary */
const wp=(t,s)=>{const p=prod(t.id),w=p?wprice(p,s):0;return w>0?' (Price: '+fmt(w)+')':''};
function totals(){
  const m={};
  S.lines.forEach(l=>{const p=prod(l.pid),t=m[l.pid]=m[l.pid]||{id:l.pid,name:p?p.name:'Removed item',by:{}};t.by[l.size]=(t.by[l.size]||0)+l.qty});
  return Object.values(m).map(t=>{t.kg=SIZES.reduce((a,s)=>a+(t.by[s]||0)*s/1000,0);return t}).sort((a,b)=>a.name.localeCompare(b.name));
}
function bill(ls){
  const rows=ls.map(l=>{const p=prod(l.pid),a=p?price(p,l.size)*l.qty:0;return {name:p?p.name:'Removed item',size:l.size,qty:l.qty,amt:a}});
  return {rows,total:rows.reduce((a,r)=>a+r.amt,0)};
}
function sumText(){
  return (S.delivery?'Delivery: '+S.delivery+'\n\n':'')+totals().map((t,i)=>`${i+1}. ${t.name}\n`+ORD.filter(s=>t.by[s]).map(s=>`     ${lbl(s)} - ${t.by[s]}${wp(t,s)}`).join('\n')).join('\n\n');
}
function billText(i){
  const [f,ls]=G[i],b=bill(ls);
  return `Flat ${f}\n`+(S.delivery?'Delivery: '+S.delivery+'\n':'')+'\n'+b.rows.map(r=>`${r.name} ${sz(r.size)}× ${r.qty} = ${rs(r.amt)}`).join('\n')+`\n\nTotal: ${rs(b.total)}`;
}
function vSum(){
  if(!S.lines.length)return `<h1>Summary</h1><div class="card">No orders yet. Enter orders first and the totals and bills appear here.</div>`;
  G=groups();
  const T=totals();let grand=0,retail=0,whole=0,nowh=false;
  S.lines.forEach(l=>{const p=prod(l.pid);if(p){const a=price(p,l.size)*l.qty,w=wprice(p,l.size)*l.qty;retail+=a;whole+=w;if(a>0&&!w)nowh=true}});
  const bills=G.map(([f,ls],i)=>{const b=bill(ls);grand+=b.total;
    return `<div class="card ${S.paid[f]?'paid':''}"><div class="pn ph"><span>Flat ${esc(f)}</span><button class="ck ${S.paid[f]?'on':''}" aria-pressed="${!!S.paid[f]}" aria-label="Mark flat ${esc(f)} as paid" onclick="pay(${i},this)">✓</button></div>`+b.rows.map(r=>`<div class="ln"><span>${esc(r.name)}${sfx(r.size)} × ${r.qty}</span><span>${rs(r.amt)}</span></div>`).join('')+
    `<div class="tot"><span>Total</span><span>${rs(b.total)}</span></div><button class="btn alt" onclick="copy(billText(${i}),this)">Copy bill</button></div>`}).join('');
  return `<h1>Summary</h1><label>Delivery date<input value="${esc(S.delivery)}" oninput="S.delivery=this.value;save()" placeholder="e.g. Sat, 27 Sep"></label>
  <label>Shop name (printed on PDFs)<input value="${esc(S.shop)}" oninput="S.shop=this.value;save()" placeholder="Your shop or brand name"></label>
  <button class="btn" onclick="dl('summary')">Download order summary PDF</button><button class="btn alt" onclick="dl('order')">Download product summary PDF</button><button class="btn alt" onclick="dl('bill')">Download bills PDF</button><p class="mu" id="pdfmsg"></p>
  <h2>Whole pre-order</h2>
  <div class="card"><div class="ln"><span>Total number of orders</span><b>${S.lines.length}</b></div><div class="ln"><span>Total number of flats</span><b>${G.length}</b></div><div class="ln"><span>Total retail price</span><b>${rs(retail)}</b></div><div class="ln"><span>Total wholesale price</span><b>${rs(whole)}</b></div><div class="tot"><span>Total profit</span><span>${rs(retail-whole)}</span></div>${nowh?'<p class="mu" style="margin:8px 0 0">Some ordered items have no wholesale price set in the Catalog, so profit may be too high.</p>':''}</div>
  <h2>Products to prepare</h2>`+
  T.map((t,i)=>`<div class="card"><div class="pn">${i+1}. ${esc(t.name)}</div>`+ORD.filter(s=>t.by[s]).map(s=>`<div class="ln"><span>${lbl(s)}${wp(t,s)}</span><b>${t.by[s]}</b></div>`).join('')+`${!(t.kg>0)?'':`<div class="mu" style="margin:6px 0 0">Total weight: ${fmt(t.kg)} KG</div>`}</div>`).join('')+
  `<button class="btn alt" onclick="copy(sumText(),this)">Copy product summary</button>
  <h2>Bills by flat</h2><p class="mu">Tap the tick when a flat has paid. This is only for your reference and does not appear in the bill PDF or copied bill.</p>${bills}
  <div class="gt"><span>All flats</span><span>${rs(grand)}</span></div>
  <p style="text-align:center;margin-top:18px"><button class="link dg" onclick="clearAll()">${S.arm==='clear'?'Tap again to delete all orders':'Start a new batch (clear all orders)'}</button></p>`;
}
function pay(i,b){const f=G[i][0],on=S.paid[f]=!S.paid[f];save();b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.closest('.card').classList.toggle('paid',on)}
function clearAll(){arm('clear',()=>{S.lines=[];S.paid={};S.msg='';save()})}
async function copy(t,b){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
  const o=b.textContent;b.textContent='Copied';setTimeout(()=>{b.textContent=o},1200);
}
/* PDFs */
const R=n=>'Rs. '+fmt(n);
function mkDoc(){return new window.jspdf.jsPDF({unit:'mm',format:'a4'})}
function head(d,title){
  d.setTextColor(0);d.setFont('helvetica','bold');d.setFontSize(20);d.text(S.shop||'SnackSpot',15,20);
  d.setFont('helvetica','normal');d.setFontSize(12);d.text(title,15,28);
  if(S.delivery)d.text('Delivery: '+S.delivery,195,28,{align:'right'});
  d.line(15,32,195,32);return 42;
}
function orderPdf(){
  const d=mkDoc(),T=totals();let y=head(d,'Order summary - '+groups().length+' flats');
  T.forEach((t,i)=>{
    const rows=ORD.filter(s=>t.by[s]);
    if(y+rows.length*6+18>282){d.addPage();y=20}
    d.setFont('helvetica','bold');d.setFontSize(13);d.text((i+1)+'. '+t.name,15,y);y+=7;
    d.setFont('helvetica','normal');d.setFontSize(12);
    rows.forEach(s=>{d.text(lbl(s),22,y);d.text(String(t.by[s]),90,y,{align:'right'});const w=wp(t,s);if(w)d.text(w.trim(),96,y);y+=6});
    if(t.kg>0){d.setTextColor(100);d.text('Total weight: '+fmt(t.kg)+' KG',22,y);d.setTextColor(0);y+=6}
    y+=5;
  });
  return d;
}
function billPdf(){
  const d=mkDoc(),g=groups();let grand=0;
  g.forEach(([f,ls],i)=>{
    if(i)d.addPage();
    const b=bill(ls);grand+=b.total;let y=head(d,'Bill - Flat '+f);
    d.setFont('helvetica','bold');d.setFontSize(12);d.text('Item',15,y);d.text('Qty',140,y,{align:'right'});d.text('Amount',195,y,{align:'right'});y+=3;d.line(15,y,195,y);y+=7;
    d.setFont('helvetica','normal');
    b.rows.forEach(r=>{
      const t=d.splitTextToSize(r.name+sfx(r.size),110);
      if(y+t.length*6>270){d.addPage();y=20}
      d.text(t,15,y);d.text(String(r.qty),140,y,{align:'right'});d.text(R(r.amt),195,y,{align:'right'});y+=6*t.length+1;
    });
    y+=2;d.line(15,y,195,y);y+=8;
    d.setFont('helvetica','bold');d.setFontSize(14);d.text('Total',15,y);d.text(R(b.total),195,y,{align:'right'});
    d.setFont('helvetica','normal');d.setFontSize(11);d.setTextColor(100);d.text('Thank you for your order!',15,y+14);
  });
  if(g.length>1){
    d.addPage();let y=head(d,'All flats');d.setFontSize(12);
    g.forEach(([f,ls])=>{if(y>270){d.addPage();y=20}d.text('Flat '+f,15,y);d.text(R(bill(ls).total),195,y,{align:'right'});y+=7});
    y+=2;d.line(15,y,195,y);y+=8;d.setFont('helvetica','bold');d.setFontSize(14);d.text('Grand total',15,y);d.text(R(grand),195,y,{align:'right'});
  }
  return d;
}
function qtyTxt(l){return l.size>0?lbl(l.size)+' x '+l.qty:l.qty+' '+lbl(l.size)}
function summaryPdf(){
  const d=mkDoc(),g=groups();let y=head(d,'Order summary (amounts in Rs.)'),n=0,retail=0,whole=0;
  const th=()=>{d.setFillColor(232,232,238);d.rect(15,y-5,180,8,'F');d.setFont('helvetica','bold');d.setFontSize(9);d.setTextColor(0);
    d.text('Serial No.',17,y);d.text('Flat',36,y);d.text('Product',57,y);d.text('Quantity',106,y);d.text('Retail Price',162,y,{align:'right'});d.text('Wholesale Price',195,y,{align:'right'});y+=8};
  th();
  g.forEach(([f,ls])=>ls.forEach(l=>{
    const p=prod(l.pid),a=p?price(p,l.size)*l.qty:0,w=p?wprice(p,l.size)*l.qty:0;
    retail+=a;whole+=w;
    const nm=d.splitTextToSize(p?p.name:'Removed item',46);
    if(y+5*nm.length>278){d.addPage();y=20;th()}
    n++;d.setFont('helvetica','normal');d.setFontSize(10);
    d.text(String(n),17,y);d.text(String(f),36,y);d.text(nm,57,y);d.text(qtyTxt(l),106,y);
    d.text(fmt(a),162,y,{align:'right'});d.text(fmt(w),195,y,{align:'right'});
    y+=5*(nm.length-1);d.setDrawColor(210);d.line(15,y+2.5,195,y+2.5);y+=7.5;
  }));
  y+=6;if(y>232){d.addPage();y=20}
  d.setFont('helvetica','bold');d.setFontSize(13);d.text('Summary',15,y);y+=4;d.setDrawColor(0);d.line(15,y,195,y);y+=8;d.setFontSize(12);
  [['Total number of orders',String(n)],['Total number of flats',String(g.length)],['Total retail price',R(retail)],['Total wholesale price',R(whole)],['Total profit',R(retail-whole)]].forEach(([a,b],i)=>{
    d.setFont('helvetica',i===4?'bold':'normal');d.text(a,15,y);d.text(b,195,y,{align:'right'});y+=8;
  });
  return d;
}
async function dl(kind){
  const m=$('pdfmsg');m.textContent='';
  if(!window.jspdf){m.textContent='The PDF tool is missing. Run "npm run prep" and rebuild the app.';return}
  const dt=(S.delivery||'').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'');
  const name=({order:'products',summary:'order-summary',bill:'bills'}[kind])+(dt?'-'+dt:'')+'.pdf';
  const P=window.Capacitor&&window.Capacitor.Plugins;
  try{
    const d=kind==='order'?orderPdf():kind==='summary'?summaryPdf():billPdf();
    if(P&&P.Filesystem&&P.Share){
      const b64=d.output('datauristring').split(',')[1];
      const f=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
      await P.Share.share({title:name,url:f.uri,dialogTitle:'Save or send PDF'});
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(d.output('blob'));a.download=name;document.body.appendChild(a);a.click();a.remove();
    }
    m.textContent='PDF ready: '+name;
  }catch(e){if(!/cancel/i.test((e&&e.message)||''))m.textContent='Could not create the PDF.'}
}
render();
</script>
